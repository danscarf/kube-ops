apiVersion: v1
kind: Secret
metadata:
  name: openclaw-secrets
  namespace: openclaw
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false,Replace=false
type: Opaque
stringData:
  OPENROUTER_API_KEY: "REPLACE_WITH_YOUR_OPENROUTER_API_KEY"
