apiVersion: openclaw.rocks/v1alpha1
kind: OpenClawInstance
metadata:
  name: openclaw
  namespace: openclaw
spec:
  envFrom:
  - secretRef:
      name: openclaw-secrets
  image:
    repository: ghcr.io/openclaw/openclaw
    tag: 2026.4.26
    digest: sha256:9e055aedeb20dfdee46e3c0b085375cd64df0796ed2f804448cd2f07c1782364
    pullPolicy: IfNotPresent
  config:
    raw:
      gateway:
        mode: local
        controlUi:
          allowedOrigins:
          - "http://openclaw.home"
          - "https://openclaw.home"
      agents:
        defaults:
          timeoutSeconds: 300
          llm:
            idleTimeoutSeconds: 300
          model:
            primary: "ollama/gemma4:e4b"
          models:
            ollama: {}
      models:
        providers:
          ollama:
            baseUrl: "http://10.0.2.248:11434"
            apiKey: "ollama-local"
            api: "ollama"
            models:
            - id: "gemma4:e4b"
              name: "Gemma 4 E4B"
              reasoning: false
              input: ["text"]
              cost:
                input: 0
                output: 0
                cacheRead: 0
                cacheWrite: 0
              contextWindow: 65536
              maxTokens: 8192
  security:
    networkPolicy:
      additionalEgress:
      - to:
        - ipBlock:
            cidr: 10.0.2.248/32
        ports:
        - port: 11434
          protocol: TCP
  storage:
    persistence:
      enabled: true
      size: 2Gi
      storageClass: longhorn