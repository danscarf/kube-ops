resources:
- ./../../base
- ingress.yaml

# Strip the upstream ArgoCD NetworkPolicies. The dev cluster runs k3s (kube-router enforces
# NetworkPolicy); these policies block the application-controller <-> repo-server traffic and
# break ArgoCD on this cluster. Removing them here keeps live state and git in agreement so
# the self-managing argocd-dev app stays Synced instead of re-adding them on every sync.
patches:
- target:
    group: networking.k8s.io
    version: v1
    kind: NetworkPolicy
  patch: |-
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: ignored
    $patch: delete

# Preserve --enable-helm (kustomize overlays render Helm charts) and pin resource tracking to
# label. ArgoCD 3.0 flips the default to annotation tracking; pinning label keeps existing
# resources from being re-adopted. Strategic-merge into the upstream argocd-cm data map.
- target:
    kind: ConfigMap
    name: argocd-cm
  patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: argocd-cm
    data:
      kustomize.buildOptions: --enable-helm
      application.resourceTrackingMethod: label
